name: Project Control & Contract Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate project memory, active release, schemas, and contracts
        run: python3 scripts/validate_repo.py
      - name: Check stale project state
        run: python3 scripts/check_stale_state.py
      - name: Validate BOT public OAS snapshot and canonical HTTP proof
        run: python3 scripts/verify_bot_stat_category_snapshot.py
      - name: Verify R3 public workflows never load BOT Secrets or run live
        run: |
          python3 scripts/check_bot_r3_workflow_boundary.py
          python3 -m unittest discover -s research/issue-11/diagnostics -p 'test_bot_r3_positive_auth.py' -v
          python3 -m unittest discover -s research/issue-11/diagnostics -p 'test_bot_r3_env_metadata.py' -v
